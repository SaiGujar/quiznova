<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz Nova - Welcome</title>
    <style>
        :root {
            --primary: #ff4757;
            --secondary: #2ed573;
            --accent: #ffa502;
            --dark: #2f3542;
            --light: #f1f2f6;
            --pink-bg: #fff0f3;
            --pink-border: #ffb6c1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #fff0f3 0%, #e8f4fd 100%);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            background: white;
            max-width: 700px;
            width: 100%;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            text-align: center;
            border: 2px solid var(--pink-border);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 3rem;
            color: var(--primary);
            font-style: italic;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px rgba(255, 71, 87, 0.1);
        }

        h2 {
            font-size: 1.5rem;
            color: #2ed573;
            margin-bottom: 25px;
            font-weight: 600;
        }

        p {
            font-size: 1.2rem;
            color: #57606f;
            margin-bottom: 30px;
        }

        .features-list {
            display: flex;
            justify-content: center;
            gap: 15px;
            list-style: none;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .features-list li {
            background: var(--light);
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 600;
            color: #57606f;
            font-size: 0.95rem;
            border: 1px solid #dfe4ea;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: transform 0.2s;
        }

        .features-list li:hover {
            transform: translateY(-3px);
            background: #ff4757;
            color: white;
            border-color: #ff4757;
        }

        .btn-start {
            display: inline-block;
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            color: white;
            padding: 16px 45px;
            font-size: 1.25rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.3);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-start:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 71, 87, 0.4);
            background: linear-gradient(135deg, #ff3838 0%, #ff5252 100%);
        }

        .alt-link {
            margin-top: 25px;
            display: block;
            font-size: 0.95rem;
        }

        .alt-link a {
            color: #747d8c;
            text-decoration: none;
            transition: color 0.2s;
        }

        .alt-link a:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        nav.page-nav {
            margin-top: 30px;
            padding: 15px 25px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            border: 1px solid #eee;
        }

        nav.page-nav a {
            display: inline-block;
            margin: 0 5px;
            padding: 8px 16px;
            border-radius: 8px;
            color: #333;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: background 0.2s;
        }

        nav.page-nav a.prev { background: #f7c6df; }
        nav.page-nav a.next { background: #d8e8ff; }
        nav.page-nav a.home { background: #e5e5e5; }
        nav.page-nav a:hover { opacity: 0.85; }
        nav.page-nav p { margin: 0; font-size: 13px; color: #666; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>QUIZ NOVA</h1>
        <h2>Welcome to Quiz Nova</h2>
        <p>Test your knowledge with fun, challenging quizzes designed for academic excellence.</p>

        <ul class="features-list">
            <li>Learn</li>
            <li>Think</li>
            <li>Challenge</li>
            <li>Win</li>
        </ul>

        <a href="page2.html" class="btn-start">Start Quiz</a>

        <div class="alt-link">
            <a href="page5.html">Open alternate welcome page</a>
        </div>
    </div>

    <nav class="page-nav">
        <a href="page18.html" class="prev">← Previous (18)</a>
        <a href="page2.html" class="next">Next (2) →</a>
        <a href="page1.html" class="home">Home</a>
        <p>Page 1 of 18</p>
    </nav>

</body>
</html>
