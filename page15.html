<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Results - Quiz Nova</title>
    <style>
        :root {
            --primary: #ff4757;
            --secondary: #2ed573;
            --dark: #2f3542;
            --light: #f1f2f6;
            --pink-border: #ffb6c1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #fff0f3 0%, #e8f4fd 100%);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
        }

        .container {
            background: white;
            max-width: 650px;
            width: 100%;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            border: 2px solid var(--pink-border);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2.8rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        h2 {
            font-size: 1.5rem;
            color: var(--secondary);
            margin-bottom: 30px;
        }

        .score-card {
            background: var(--light);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 35px;
            border: 1px solid #dfe4ea;
        }

        .score-card p {
            font-size: 1.15rem;
            color: #57606f;
            margin-bottom: 10px;
        }

        .score-value {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary);
        }

        .buttons-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            color: white;
            padding: 14px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.3);
            transition: all 0.3s ease;
        }

        .button.secondary {
            background: linear-gradient(135deg, #2ed573 0%, #26af5f 100%);
            box-shadow: 0 8px 20px rgba(46, 213, 115, 0.3);
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 71, 87, 0.4);
        }

        nav.page-nav {
            margin-top: 30px;
            padding: 15px 25px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            border: 1px solid #eee;
        }

        nav.page-nav a {
            display: inline-block;
            margin: 0 5px;
            padding: 8px 16px;
            border-radius: 8px;
            color: #333;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: background 0.2s;
        }

        nav.page-nav a.prev { background: #f7c6df; }
        nav.page-nav a.next { background: #d8e8ff; }
        nav.page-nav a.home { background: #e5e5e5; }
        nav.page-nav a:hover { opacity: 0.85; }
        nav.page-nav p { margin: 0; font-size: 13px; color: #666; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Quiz Completed!</h1>
        <h2>Fantastic Job! 🎉</h2>

        <div class="score-card">
            <p>Your Total Score</p>
            <div class="score-value">20 / 20</div>
            <p style="margin-top: 10px; color: var(--secondary); font-weight: bold;">100% Accuracy (+20 Nova Points)</p>
        </div>

        <div class="buttons-group">
            <a href="page16.html" class="button secondary">View Solutions</a>
            <a href="page6.html" class="button">Try Another Quiz</a>
        </div>
    </div>

    <nav class="page-nav">
        <a href="page14.html" class="prev">← Previous (14)</a>
        <a href="page16.html" class="next">Next (16) →</a>
        <a href="page1.html" class="home">Home</a>
        <p>Page 15 of 18</p>
    </nav>

</body>
</html>
